# =============================================================================
# Docker Compose - Acne Advisor AI local full stack
# Services: Frontend · Backend · PostgreSQL · Neo4j · Qdrant · Redis
# =============================================================================
#
# Lưu ý:
# - Các service chỉ publish trên 127.0.0.1.
# - Dữ liệu được lưu trong các thư mục bind mount dưới ./data.
# - Không dùng `docker compose down -v` nếu không chủ động xóa dữ liệu.
# =============================================================================

services:
  frontend:
    image: acne-advisor-frontend:local
    build:
      context: ./src/frontend
    container_name: acne_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8088}:8080"
    depends_on:
      backend:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: acne-advisor-backend:local
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: acne_backend
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: "${DOCKER_DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-acne_agent_db}}"
      DB_POOL_SIZE: "${DB_POOL_SIZE:-5}"
      DB_MAX_OVERFLOW: "${DB_MAX_OVERFLOW:-5}"
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      NEO4J_URI: bolt://neo4j:7687
      OLLAMA_BASE_URL: "${DOCKER_OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
      # A missing optional local model must not veto the primary Gemini service.
      LLM_PROVIDER_FALLBACK_ENABLED: "${DOCKER_LLM_PROVIDER_FALLBACK_ENABLED:-false}"
      LANGFUSE_ENABLED: "false"
      LLAMA_CLOUD_API_KEY: ""
      OPENAI_API_KEY: ""
      RELEASE_READINESS_TEST_MODE: ""
      RELEASE_READINESS_HEALTH_DOUBLE: "false"
      HF_HOME: /models
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      OBSERVABILITY_TRACE_DIR: /tmp/acne-traces
      RERANKER_DEVICE: "${RERANKER_DEVICE:-cuda}"
      OMP_NUM_THREADS: "${OMP_NUM_THREADS:-2}"
      TOKENIZERS_PARALLELISM: "false"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - type: bind
        source: "${HF_MODEL_CACHE_PATH:-${USERPROFILE}/.cache/huggingface/hub}"
        target: /models/hub
        read_only: true
        bind:
          create_host_path: false
    # Only the required knowledge store gates application startup. Chat history,
    # exact cache and structural graph retain their existing degraded behavior.
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_started
      redis:
        condition: service_started
      neo4j:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 240s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=7).close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: pgvector/pgvector:pg16@sha256:00ba258a66dac104fd5171074a0084462a64a1369d8513f3d0a634e2f24d15bc
    container_name: acne_postgres
    restart: unless-stopped

    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"

    environment:
      POSTGRES_USER: "${POSTGRES_USER:-user}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-password}"
      POSTGRES_DB: "${POSTGRES_DB:-acne_agent_db}"

    volumes:
      - ./data/postgres:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-acne_agent_db}
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  neo4j:
    image: neo4j:5@sha256:0b5d3ab6ec1b866890dbfb53bf4fe1cf039f9e03c96165599a403005b7e7bcc3
    container_name: acne_neo4j
    restart: unless-stopped

    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"

    environment:
      NEO4J_AUTH: "${NEO4J_AUTH:-neo4j/password}"
      NEO4J_PLUGINS: '["apoc"]'

    volumes:
      - ./data/neo4j/data:/data
      - ./data/neo4j/logs:/logs
      - ./data/neo4j/plugins:/plugins

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          auth="$${NEO4J_AUTH}";
          user="$${auth%%/*}";
          pass="$${auth#*/}";
          echo "RETURN 1;" |
          cypher-shell
          -a bolt://localhost:7687
          -u "$${user}"
          -p "$${pass}"
          >/dev/null 2>&1
          || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  qdrant:
    image: qdrant/qdrant:v1.18.0@sha256:b3063c673f3973877c038eeecc392bad5011f072ee7892b56c9a8e204a3bdea9
    container_name: acne_qdrant
    restart: unless-stopped

    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"

    volumes:
      - ./data/qdrant:/qdrant/storage

    # The pinned image has bash, but neither curl nor wget. Verify HTTP readiness.
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/6333;
          printf 'GET /readyz HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3;
          read -r status <&3;
          [[ "$$status" == *" 200 "* ]]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    container_name: acne_redis
    restart: unless-stopped

    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

    command:
      - redis-server
      - --appendonly
      - "yes"

    volumes:
      - ./data/redis_data:/data

    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli ping | grep -q PONG
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
