# Optional local Langfuse stack. It is isolated from the application databases.
# Create an ignored .env.langfuse.local with strong values before starting it.
name: acne-advisor-observability

x-langfuse-environment: &langfuse-environment
  NEXTAUTH_URL: "${LANGFUSE_PUBLIC_URL:-http://localhost:3001}"
  DATABASE_URL: "postgresql://langfuse:${LANGFUSE_POSTGRES_PASSWORD:?required}@langfuse-postgres:5432/langfuse"
  SALT: "${LANGFUSE_SALT:?required}"
  ENCRYPTION_KEY: "${LANGFUSE_ENCRYPTION_KEY:?required}"
  TELEMETRY_ENABLED: "false"
  CLICKHOUSE_MIGRATION_URL: "clickhouse://langfuse-clickhouse:9000"
  CLICKHOUSE_URL: "http://langfuse-clickhouse:8123"
  CLICKHOUSE_USER: "langfuse"
  CLICKHOUSE_PASSWORD: "${LANGFUSE_CLICKHOUSE_PASSWORD:?required}"
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  CLICKHOUSE_CLUSTER_NAME: "default"
  REDIS_HOST: "langfuse-redis"
  REDIS_PORT: "6379"
  REDIS_AUTH: "${LANGFUSE_REDIS_PASSWORD:?required}"
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: "langfuse"
  LANGFUSE_S3_EVENT_UPLOAD_REGION: "auto"
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: "langfuse"
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: "${LANGFUSE_MINIO_PASSWORD:?required}"
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: "http://langfuse-minio:9000"
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: "events/"
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: "langfuse"
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: "auto"
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: "langfuse"
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: "${LANGFUSE_MINIO_PASSWORD:?required}"
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: "http://langfuse-minio:9000"
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: "media/"
  LANGFUSE_S3_BATCH_EXPORT_ENABLED: "false"

x-langfuse-dependencies: &langfuse-dependencies
  langfuse-postgres:
    condition: service_healthy
  langfuse-clickhouse:
    condition: service_healthy
  langfuse-redis:
    condition: service_healthy
  langfuse-minio:
    condition: service_healthy

services:
  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4.38.0@sha256:8631cf429efc4a2981d4e6ced4c005b9f6f620a4e34625baf60152301ec6d006
    restart: unless-stopped
    depends_on: *langfuse-dependencies
    environment: *langfuse-environment
    healthcheck:
      test:
        - CMD-SHELL
        - 'wget --no-verbose --tries=1 --spider "http://$$(hostname):3030/api/health" || exit 1'
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4.38.0@sha256:47ef2f121e2959c8458c209d118949ade25778017e3f5b75b1e45f72276811c3
    restart: unless-stopped
    depends_on: *langfuse-dependencies
    ports:
      - "127.0.0.1:${LANGFUSE_PORT:-3001}:3000"
    environment:
      <<: *langfuse-environment
      NEXTAUTH_SECRET: "${LANGFUSE_NEXTAUTH_SECRET:?required}"
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: "${LANGFUSE_MINIO_PUBLIC_URL:-http://localhost:9090}"
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: "http://langfuse-minio:9000"
      LANGFUSE_INIT_ORG_ID: "${LANGFUSE_INIT_ORG_ID:-}"
      LANGFUSE_INIT_ORG_NAME: "${LANGFUSE_INIT_ORG_NAME:-}"
      LANGFUSE_INIT_PROJECT_ID: "${LANGFUSE_INIT_PROJECT_ID:-}"
      LANGFUSE_INIT_PROJECT_NAME: "${LANGFUSE_INIT_PROJECT_NAME:-}"
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: "${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:-}"
      LANGFUSE_INIT_PROJECT_SECRET_KEY: "${LANGFUSE_INIT_PROJECT_SECRET_KEY:-}"
      LANGFUSE_INIT_USER_EMAIL: "${LANGFUSE_INIT_USER_EMAIL:-}"
      LANGFUSE_INIT_USER_NAME: "${LANGFUSE_INIT_USER_NAME:-}"
      LANGFUSE_INIT_USER_PASSWORD: "${LANGFUSE_INIT_USER_PASSWORD:-}"
    healthcheck:
      test:
        - CMD-SHELL
        - 'wget --no-verbose --tries=1 --spider "http://$$(hostname):3000/api/public/health?failIfDatabaseUnavailable=true" || exit 1'
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  langfuse-clickhouse:
    image: docker.io/clickhouse/clickhouse-server:25.12@sha256:8a790dd3468db22b1d4e7b18a176f378ff5ff6053b9c48dd4ea1fa71a24c5ba6
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: "${LANGFUSE_CLICKHOUSE_PASSWORD:?required}"
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test:
        - CMD-SHELL
        - wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  langfuse-minio:
    image: cgr.dev/chainguard/minio@sha256:e7728e37a015dcd2f2b146abc4aedc0096769ac72cb64cc9ed36b7f4183361e1
    restart: unless-stopped
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: langfuse
      MINIO_ROOT_PASSWORD: "${LANGFUSE_MINIO_PASSWORD:?required}"
    ports:
      - "127.0.0.1:${LANGFUSE_MINIO_PORT:-9090}:9000"
    volumes:
      - langfuse_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s

  langfuse-redis:
    image: docker.io/library/redis:7@sha256:71da9275c5f3fcb97d0fa0c8c5b36cc995327265420f17a04bfd544f458059f7
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - "${LANGFUSE_REDIS_PASSWORD:?required}"
      - --maxmemory-policy
      - noeviction
    volumes:
      - langfuse_redis_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$${REDIS_AUTH}" ping 2>/dev/null | grep -q PONG
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    environment:
      REDIS_AUTH: "${LANGFUSE_REDIS_PASSWORD:?required}"

  langfuse-postgres:
    image: docker.io/library/postgres:17@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: "${LANGFUSE_POSTGRES_PASSWORD:?required}"
      POSTGRES_DB: langfuse
      TZ: UTC
      PGTZ: UTC
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  langfuse_postgres_data:
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:
  langfuse_minio_data:
  langfuse_redis_data:
